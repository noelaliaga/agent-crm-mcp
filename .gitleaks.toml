# gitleaks configuration: the default rules, plus an allowlist for values that are
# synthetic on purpose (throwaway CI database, fake backends, a test JWT whose payload is
# {"role":"crm_agent"} and whose signature is the word "signature").
title = "agent-crm-mcp"

[extend]
useDefault = true

[allowlist]
description = "Synthetic credentials used only by CI, tests and the offline demo"
regexes = [
  '''ci-only-[A-Za-z0-9-]+''',
  '''demo-agent-token-not-a-secret''',
  '''smoke-token-0123456789''',
  '''test-agent-token(-0123456789)?''',
  '''wrong-token-abcdef-123456''',
  '''eyJhbGciOiJIUzI1NiJ9\.eyJyb2xlIjoiY3JtX2FnZW50In0\.c2lnbmF0dXJl''',
]
