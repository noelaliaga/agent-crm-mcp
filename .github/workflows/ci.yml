name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "ruff==0.13.0" "mypy==1.18.2"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "pytest==8.4.2"
      - name: Unit tests (fake PostgREST, no network)
        run: python -m pytest -q
      - name: Smoke test
        run: bash scripts/smoke.sh

  # Real Postgres + PostgREST. Proves the guarantees the fake backend can only imitate:
  # column grants, the audit trigger and database-assigned note authors.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CRM_IT_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/postgres
      CRM_IT_JWT_SECRET: ci-only-jwt-secret-that-is-at-least-32-chars
      CRM_IT_POSTGREST_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "pytest==8.4.2"
      - name: Apply roles, migration and synthetic seed
        run: |
          psql "$CRM_IT_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/integration/bootstrap_plain_postgres.sql
          psql "$CRM_IT_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/0001_crm_min.sql
          psql "$CRM_IT_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/seed.sql
      - name: Start PostgREST
        run: |
          docker run -d --name postgrest --network host \
            -e PGRST_DB_URI="postgresql://authenticator:ci-only-authenticator@localhost:5432/postgres" \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$CRM_IT_JWT_SECRET" \
            -e PGRST_SERVER_PORT=3000 \
            postgrest/postgrest:v12.2.3
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:3000/ && exit 0
            sleep 1
          done
          docker logs postgrest
          exit 1
      - name: Integration tests
        run: python -m pytest -m integration -v
      - name: PostgREST logs
        if: failure()
        run: docker logs postgrest
