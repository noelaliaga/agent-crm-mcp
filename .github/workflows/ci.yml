name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The dev extra in pyproject.toml pins pytest, ruff and mypy for CI and local use.
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: seed.sql matches seed_data.json
        run: python -m devtools.seed --check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: Unit tests (fake PostgREST, no network)
        run: python -m pytest -q
      - name: Smoke test
        run: bash scripts/smoke.sh

  # Real Postgres + PostgREST. Proves the guarantees the fake backend can only imitate:
  # column grants, the audit trigger and database-assigned note authors.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CRM_IT_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/postgres
      CRM_IT_JWT_SECRET: ci-only-jwt-secret-that-is-at-least-32-chars
      CRM_IT_POSTGREST_URL: http://localhost:3000
      # A module whose backend is missing fails instead of being skipped.
      CRM_IT_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - name: Apply roles, migration and synthetic seed
        run: |
          psql "$CRM_IT_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/integration/bootstrap_plain_postgres.sql
          psql "$CRM_IT_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/0001_crm_min.sql
          psql "$CRM_IT_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/seed.sql
      - name: Start PostgREST
        run: |
          docker run -d --name postgrest --network host \
            -e PGRST_DB_URI="postgresql://authenticator:ci-only-authenticator@localhost:5432/postgres" \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$CRM_IT_JWT_SECRET" \
            -e PGRST_SERVER_PORT=3000 \
            postgrest/postgrest:v12.2.3
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:3000/ && exit 0
            sleep 1
          done
          docker logs postgrest
          exit 1
      - name: Integration tests (no skips allowed)
        run: |
          set -o pipefail
          python -m pytest -m integration -v -rs | tee pytest-integration.log
          if grep -Eq "[0-9]+ skipped" pytest-integration.log; then
            echo "integration tests were skipped; the job must run all of them" >&2
            exit 1
          fi
      - name: PostgREST logs
        if: failure()
        run: docker logs postgrest

  # Secret scan of the full history on every push, pull request, weekly and on demand.
  # The gitleaks binary is used directly: gitleaks-action scans a push as a diff against
  # the previous commit, which does not exist on the first push, and never scanned here.
  # Synthetic CI/test values are allowlisted in .gitleaks.toml.
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.21.2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "$base/$file"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          tar -xzf "$file" gitleaks
      - name: Scan every commit
        run: ./gitleaks detect --source . --config .gitleaks.toml --log-opts="--all" --redact --verbose
